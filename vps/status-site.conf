# СТРАНИЦА СОСТОЯНИЯ НА МАШИНЕ-НАБЛЮДАТЕЛЕ.
#
# 🔴 ПОЧЕМУ ОНА ЗДЕСЬ, А НЕ НА GITHUB PAGES (решение владельца 29.08.2026). Наблюдение переехало
# сюда целиком; страница поехала следом, чтобы не держать две площадки ради одного артефакта.
#
# ⚠️ ЦЕНА РЕШЕНИЯ, КОТОРУЮ НАДО ПОМНИТЬ: смерть ЭТОЙ машины теперь уносит и проверку, и страницу
# разом. Единственное, что остаётся снаружи, — сторож-пустышка на GitHub: он ничего не опрашивает,
# просыпается три раза в час и смотрит, двигалась ли отметка. Без него молчание наблюдателя стало
# бы полным и незаметным.
#
# Ставится символической ссылкой из /etc/nginx/sites-available/, сертификат — certbot.

server {
    listen 80;
    listen [::]:80;
    server_name status.dentboard.ru;

    # Место для проверки владения доменом (certbot --webroot) и переезд на TLS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name status.dentboard.ru;

    ssl_certificate     /etc/letsencrypt/live/status.dentboard.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.dentboard.ru/privkey.pem;

    root /var/www/status;
    index index.html;

    # ⚠️ СТРАНИЦУ НЕ КЭШИРОВАТЬ. На ней стои́т время последней проверки, и кэш браузера показал бы
    # вчерашнюю подпись — то есть соврал бы ровно в том, ради чего страницу открывают.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # 🔴 ДАННЫЕ ОТДАЮТСЯ С CORS, И БЕЗ ЭТОГО ЛОМАЕТСЯ ТОЧКА СОСТОЯНИЯ В КАБИНЕТАХ. Её рисует фронт
    # на app.dentboard.ru, забирая этот файл запросом из браузера — то есть с ДРУГОГО источника.
    # Раньше файл лежал на raw.githubusercontent.com, который отдаёт CORS всем; наш nginx по
    # умолчанию не отдаёт никому, и точка молча погасла бы в «состояние неизвестно».
    location /data/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
    }

    location / { try_files $uri $uri/ =404; }
}
