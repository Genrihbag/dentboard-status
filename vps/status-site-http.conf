# ПЕРВАЯ ПОЛОВИНА САЙТА СОСТОЯНИЯ — только 80-й порт.
#
# 🔴 ОТДЕЛЬНЫМ ФАЙЛОМ, И ЭТО РАЗВЯЗЫВАЕТ КУРИЦУ С ЯЙЦОМ. Проверка владения доменом (HTTP-01) требует,
# чтобы кто-то УЖЕ отдавал `/.well-known/acme-challenge/` по адресу домена. Но блок с TLS ссылается
# на сертификат, которого ещё нет, — и nginx с ним не стартует вовсе. Один файл на оба порта
# означает, что включить его до сертификата нельзя, а получить сертификат без него — тоже.
#
# Замерено 29.08.2026: certbot получил 404 с https, потому что имя в тот момент обслуживал чужой
# блок по умолчанию. Порядок теперь такой: включить ЭТОТ файл → сертификат → включить второй.
server {
    listen 80;
    listen [::]:80;
    server_name status.dentboard.ru;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # ⚠️ ПЕРЕАДРЕСАЦИЯ НА TLS — ТОЛЬКО ПОСЛЕ ТОГО, КАК ВТОРОЙ ФАЙЛ ВКЛЮЧЁН. До этого она уводила бы
    # на порт, где нас нет, и страница отвечала бы отказом соединения вместо содержимого.
    location / { return 301 https://$host$request_uri; }
}
