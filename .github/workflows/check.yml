name: Проверка доступности

on:
  # ⚠️ КРОН ЗДЕСЬ — НЕ РАСПИСАНИЕ ПРОВЕРОК, А ЗАПУСК ДЕЖУРСТВА. Разница появилась 29.08.2026 по
  # замеру: `*/5` обещает двенадцать прогонов в час, а по журналу за час их случилось РОВНО ОДИН.
  # Расписание у GitHub «best effort»: запуски задерживаются, а при нагрузке отбрасываются вовсе, и
  # заметить это можно только сравнив обещание с фактом — по подписи на странице оно неотличимо от
  # исправной работы.
  #
  # Поэтому один запуск теперь ДЕЖУРИТ пятьдесят минут, проверяя цели сам, а крон лишь поднимает
  # смену. Даже если из двенадцати выстрелов долетит один, покрытие останется почти сплошным.
  schedule:
    - cron: "*/5 * * * *"
  # ⚠️ РУЧНОЙ ЗАПУСК С ПРОВЕРОЧНЫМ СООБЩЕНИЕМ. Без флага дежурство обычное: сообщение уйдёт, только
  # если состояние сменилось. С флагом дополнительно отправляется проверочное сообщение ТЕМ ЖЕ
  # кодом, что шлёт настоящие, — и только на первом круге, иначе канал получал бы его ежеминутно.
  #
  # Зачем: в спокойную неделю канал молчит, и «всё работает» неотличимо от «токен просрочен, бота
  # выгнали из канала, chat_id не тот». Узнать об этом иначе можно было бы только в час настоящего
  # отказа — в худший из возможных моментов.
  workflow_dispatch:
    inputs:
      test_message:
        description: "Отправить проверочное сообщение в канал"
        type: boolean
        default: false

# Право писать в репозиторий: результат проверки коммитится сюда же и публикуется на Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# ⚠️ ОДНА СМЕНА ЗА РАЗ, И ОЧЕРЕДЬ ИЗ ОДНОГО. `cancel-in-progress: false` намеренно: обрывать
# дежурство посреди коммита значит рисковать полузаписанным состоянием. GitHub держит один
# ожидающий запуск и отбрасывает остальные — то есть лишние выстрелы крона не копятся, а ждущая
# смена заступает сразу, как только предыдущая сошла. Это же чинит и смерть исполнителя: следующая
# смена начнётся не позже, чем через пять минут.
concurrency:
  group: status-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Смена — 50 минут, потолок задания на пять больше: разница нужна на последний круг и уборку.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ⚠️ ПРОБЫ ГОНЯЮТСЯ ПЕРЕД ДЕЖУРСТВОМ, а не «когда-нибудь». Механизм по замыслу НИЧЕГО не
      # делает в большинстве кругов, поэтому его поломка выглядит как спокойствие: авы просто не
      # меняются. Ошибка здесь обнаружилась бы при первом настоящем отказе — то есть ровно тогда,
      # когда механизм и нужен.
      - name: Пробы свода состояния и гистерезиса
        run: node --test avatar.test.mjs

      - name: Дежурство — проверять цели весь час, а не раз в час
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MESSAGE: ${{ inputs.test_message }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash duty.sh
