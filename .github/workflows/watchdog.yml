name: Сторож наблюдателя

# 🔴 ЭТО НЕ ПРОВЕРКА СЕРВИСОВ. Сервисы проверяет отдельная машина раз в минуту честным таймером
# systemd; здесь GitHub отвечает на другой вопрос — ЖИВ ЛИ САМ НАБЛЮДАТЕЛЬ.
#
# Пока проверку гоняли машины GitHub, за её живость отвечал GitHub. Перенеся наблюдение к себе, мы
# получили вопрос, которого раньше не было: кто заметит, что наблюдатель замолчал. Упавший таймер,
# кончившийся диск, снесённый юнит выглядят одинаково — то есть никак.
#
# ⚠️ ЗДЕСЬ НЕНАДЁЖНОСТЬ РАСПИСАНИЯ ДОПУСТИМА, В ОТЛИЧИЕ ОТ САМОЙ ПРОВЕРКИ. Замерено 29.08.2026:
# `*/5` даёт около одного прогона в час. Для «проверить сервис» это негодно, для «заметить, что
# монитор молчит уже сорок минут» — вполне: тревога опоздает на десятки минут, а не на сутки.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: status-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 🔴 ПРОБЫ ПЕРЕЕХАЛИ СЮДА 08.09.2026, ПОТОМУ ЧТО ПЕРЕСТАЛИ ИСПОЛНЯТЬСЯ ВОВСЕ.
      #
      # Раньше их гонял `check.yml` перед дежурством. После переезда наблюдения на свою машину тот
      # workflow отключён (`disabled_manually`), а `tick.sh` тестов не запускает — то есть
      # `avatar.test.mjs`, `board.test.mjs` и `latency.test.mjs` не выполнялись ни разу с 29.08:
      # файлы на месте, все зелёные, и ни один не запускался. Ровно тот случай, когда «тесты есть»
      # неотличимо от «тестов нет».
      #
      # Здесь им место по существу: это единственный прогон, оставшийся на машинах GitHub, и он
      # так и так делает checkout с node. Ненадёжность расписания тестам безразлична — они
      # проверяют КОД, а не состояние сервисов, и опоздание на полчаса ничего не стоит.
      - name: Пробы (разбор причин отказа, свод состояния, табло, времена ответа)
        run: node --test

      - name: Жив ли наблюдатель
        # Красный тест не имеет права выключать сторожа: тесты проверяют КОД, сторож — ЖИВОСТЬ
        # наблюдателя, и пропуск второго из-за первого означал бы молчание о молчании.
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node watchdog.mjs
